{{- if not .Values.rabbitmq.useCloudProvider }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rabbitmq-server
  namespace: bookit
  annotations:
    # Wave 0: rabbitmq-ca ClusterIssuer (deployed by rabbitmq-topology-operator
    # app at wave -2) must be Ready before this wave runs.
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: rabbitmq-server-tls
  duration: 2160h
  renewBefore: 360h
  dnsNames:
    - rabbitmq
    - rabbitmq.bookit
    - rabbitmq.bookit.svc
    - rabbitmq.bookit.svc.cluster.local
    - rabbitmq-nodes
    - rabbitmq-nodes.bookit.svc
    - rabbitmq-nodes.bookit.svc.cluster.local
    - "*.rabbitmq-nodes.bookit.svc.cluster.local"
  usages:
    - server auth
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: rabbitmq-ca
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rabbitmq-client
  namespace: bookit
  annotations:
    # Wave 1: wait for the server cert (wave 0) before issuing client cert.
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: rabbitmq-client-tls
  commonName: bookit
  duration: 720h
  renewBefore: 168h
  usages:
    - client auth
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  keystores:
    pkcs12:
      create: true
      profile: Modern2023
      passwordSecretRef:
        name: rabbitmq-client-keystore-password
        key: password
  issuerRef:
    name: rabbitmq-ca
    kind: ClusterIssuer
{{- end }}
