{{ if not .Values.rabbitmq.useCloudProvider }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq-ha-v6
  namespace: bookit
spec:
  serviceName: "rabbitmq-ha-headless"
  replicas: {{ .Values.rabbitmq.replicas | default 3 }}
  selector:
    matchLabels:
      app: rabbitmq-ha
  template:
    metadata:
      labels:
        app: rabbitmq-ha
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: rabbitmq
          image: bitnamilegacy/rabbitmq:4.1.3-debian-12-r1
          env:
            - name: RABBITMQ_ERL_COOKIE
              valueFrom:
                secretKeyRef: {name: custom-db-ha-secrets, key: rabbitmq-erlang-cookie}
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef: {name: custom-db-ha-secrets, key: rabbitmq-username}
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: {name: custom-db-ha-secrets, key: rabbitmq-password}
            # Use Bitnami's native credential reconciliation for persisted data.
            # This avoids exposing the password in lifecycle-hook process args.
            - name: RABBITMQ_SECURE_PASSWORD
              value: "yes"
            - name: RABBITMQ_UPDATE_PASSWORD
              value: "yes"
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RABBITMQ_CLUSTER_NODE_NAME
              # The seed hostname must match this StatefulSet's pod-name prefix.
              # A nonexistent rabbitmq-ha-0 seed keeps every pod unready, leaving
              # rabbitmq-proxy without endpoints and clients see ECONNREFUSED.
              value: "rabbit@rabbitmq-ha-v6-0.rabbitmq-ha-headless.bookit.svc.cluster.local"
            - name: RABBITMQ_NODE_NAME
              value: "rabbit@$(MY_POD_NAME).rabbitmq-ha-headless.bookit.svc.cluster.local"
            - name: RABBITMQ_USE_LONGNAME
              value: "true"
            - name: RABBITMQ_PLUGINS
              value: "rabbitmq_management rabbitmq_prometheus rabbitmq_auth_mechanism_ssl"
            - name: RABBITMQ_NODE_SSL_PORT_NUMBER
              value: "5671"
            - name: RABBITMQ_SSL_CACERTFILE
              value: /opt/bitnami/rabbitmq/certs/ca.crt
            - name: RABBITMQ_SSL_CERTFILE
              value: /opt/bitnami/rabbitmq/certs/tls.crt
            - name: RABBITMQ_SSL_KEYFILE
              value: /opt/bitnami/rabbitmq/certs/tls.key
            - name: RABBITMQ_SSL_VERIFY
              value: verify_peer
            - name: RABBITMQ_SSL_FAIL_IF_NO_PEER_CERT
              value: "yes"
          ports:
            - containerPort: 5671
              name: amqps
            - containerPort: 15672
              name: management
            # Built-in Prometheus Metrics Plugin Port
            - containerPort: 15692
              name: metrics
          {{- if .Values.rabbitmq.resources }}
          resources:
{{ toYaml .Values.rabbitmq.resources | indent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /bitnami/rabbitmq/mnesia
            - name: rabbitmq-server-tls
              mountPath: /opt/bitnami/rabbitmq/certs
              readOnly: true
            - name: rabbitmq-config
              mountPath: /bitnami/rabbitmq/conf/custom.conf
              subPath: custom.conf
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 5671
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
            successThreshold: 1
      volumes:
        - name: rabbitmq-server-tls
          secret:
            secretName: rabbitmq-server-tls
        - name: rabbitmq-config
          configMap:
            name: rabbitmq-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.rabbitmq.storage | default "5Gi" }}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-ha-headless
  namespace: bookit
spec:
  ports:
    - port: 5671
      name: amqps
    - port: 4369
      name: epmd
    - port: 25672
      name: cluster
  clusterIP: None
  selector:
    app: rabbitmq-ha
---
# Standard Service acting as a Round-Robin Load Balancer to healthy RabbitMQ nodes
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-proxy
  namespace: bookit
spec:
  ports:
    - name: amqps
      port: 5671
      targetPort: amqps
  selector:
    app: rabbitmq-ha
{{ end }}
