{{- if not .Values.rabbitmq.useCloudProvider }}
# This Secret MUST live in the same Argo CD application (stateful-services)
# as the rabbitmq-client Certificate that references it via passwordSecretRef.
# If this secret is deployed in a different app, cert-manager will wait forever
# for the password and the Certificate will never become Ready.
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-client-keystore-password
  namespace: bookit
  annotations:
    # Must be ready BEFORE the Certificate at sync-wave "-1" tries to read it.
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
data:
  # PKCS#12 compatibility password; not a RabbitMQ login credential.
  # Value: bookit-pkcs12 (base64-encoded)
  password: Ym9va2l0LXBrY3MxMg==
{{- end }}
