{{ if .Values.mongodb.useCloudProvider }}
apiVersion: v1
kind: Service
metadata:
  name: mongodb-proxy
  namespace: bookit
spec:
  type: ExternalName
  externalName: {{ if and .Values.global.multiRegion.enabled (eq .Values.global.currentRegion .Values.global.secondaryRegion) }}replica.mongodb.cloud.bookit.com{{ else }}primary.mongodb.cloud.bookit.com{{ end }}
{{ end }}
