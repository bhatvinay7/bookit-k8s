{{- if .Values.mongodb.useCloudProvider }}
{{- if and .Values.mongodb.host (ne .Values.mongodb.host "") }}
# ExternalName Service to route in-cluster traffic to the managed cloud MongoDB.
# Set mongodb.host in your values file to the actual DigitalOcean DB hostname.
apiVersion: v1
kind: Service
metadata:
  name: mongodb-proxy
  namespace: bookit
spec:
  type: ExternalName
  externalName: {{ .Values.mongodb.host }}
{{- end }}
{{- end }}
