{{ if not .Values.redis.useCloudProvider }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-haproxy-config
  namespace: bookit
data:
  haproxy.cfg: |
    global
        maxconn 4096
    
    resolvers k8s
        parse-resolv-conf
        hold valid 10s
    
    defaults
        mode tcp
        timeout connect 5s
        timeout client 86400s
        timeout server 86400s
        default-server init-addr last,libc,none
    
    frontend redis_front
        bind *:6379
        default_backend redis_back
    
    backend redis_back
        mode tcp
        balance first
        # Use basic TCP connection check (sufficient for 1-replica development setup)
        # and avoids exposing or managing passwords inside the HAProxy config.
{{- $replicas := .Values.redis.replicas | default 3 | int }}
{{- range $i := until $replicas }}
        server redis-{{ $i }} redis-ha-{{ $i }}.redis-ha-headless.bookit.svc.cluster.local:6379 check inter 2s resolvers k8s resolve-prefer ipv4
{{- end }}
{{ end }}
