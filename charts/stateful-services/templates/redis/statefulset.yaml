{{ if not .Values.redis.useCloudProvider }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-ha
  namespace: bookit
spec:
  serviceName: "redis-ha-headless"
  replicas: {{ .Values.redis.replicas | default 3 }}
  selector:
    matchLabels:
      app: redis-ha
  template:
    metadata:
      labels:
        app: redis-ha
    spec:
      containers:
        - name: redis
          image: bitnamilegacy/redis:8.2.1-debian-12-r0
          command: ["/bin/bash", "-ec"]
          args:
            - |
              if [[ "$(hostname)" == *-0 ]]; then
                export REDIS_REPLICATION_MODE=master
              else
                export REDIS_REPLICATION_MODE=slave
              fi
              exec /opt/bitnami/scripts/redis/entrypoint.sh /opt/bitnami/scripts/redis/run.sh
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: custom-db-ha-secrets, key: redis-password}
            - name: REDIS_MASTER_HOST
              value: "redis-ha-0.redis-ha-headless.bookit.svc.cluster.local"
            - name: REDIS_MASTER_PASSWORD
              valueFrom:
                secretKeyRef: {name: custom-db-ha-secrets, key: redis-password}
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /bitnami/redis/data
        - name: sentinel
          image: bitnamilegacy/redis-sentinel:8.2.1-debian-12-r0
          env:
            - name: REDIS_MASTER_PASSWORD
              valueFrom:
                secretKeyRef: {name: custom-db-ha-secrets, key: redis-password}
            - name: REDIS_MASTER_HOST
              value: "redis-ha-0.redis-ha-headless.bookit.svc.cluster.local"
          ports:
            - containerPort: 26379
        # Metrics Exporter
        - name: metrics
          image: oliver006/redis_exporter:v1.52.0
          env:
            - name: REDIS_ADDR
              value: "redis://127.0.0.1:6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: custom-db-ha-secrets, key: redis-password}
          ports:
            - containerPort: 9121
              name: metrics
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.redis.storage | default "5Gi" }}
          {{- if .Values.redis.resources }}
{{ toYaml .Values.redis.resources | indent 10 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-ha-headless
  namespace: bookit
spec:
  ports:
    - port: 6379
      name: redis
    - port: 26379
      name: sentinel
  clusterIP: None
  selector:
    app: redis-ha
---
# Proxy: HAProxy to route to the healthy Redis master based on Sentinel checks
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-proxy
  namespace: bookit
spec:
  replicas: {{ .Values.redis.proxyReplicas | default 2 }}
  selector:
    matchLabels:
      app: redis-proxy
  template:
    metadata:
      labels:
        app: redis-proxy
    spec:
      containers:
        - name: haproxy
          image: haproxy:2.4
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: haproxy-config
              mountPath: /usr/local/etc/haproxy
      volumes:
        - name: haproxy-config
          configMap:
            name: redis-haproxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: redis-proxy
  namespace: bookit
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis-proxy
{{ end }}
