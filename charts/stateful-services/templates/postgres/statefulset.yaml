{{ if not .Values.postgres.useCloudProvider }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-ha
  namespace: bookit
  labels:
    app: postgres-ha
spec:
  serviceName: "postgres-ha-headless"
  replicas: 3
  selector:
    matchLabels:
      app: postgres-ha
  template:
    metadata:
      labels:
        app: postgres-ha
    spec:
      containers:
        - name: postgres
          image: bitnami/postgresql-repmgr:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: custom-db-ha-secrets, key: postgres-admin-password}
            - name: POSTGRESQL_USERNAME
              value: "postgres"
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef: {name: custom-db-ha-secrets, key: postgres-password}
            - name: POSTGRESQL_DATABASE
              value: "bookit"
            - name: REPMGR_PASSWORD
              valueFrom:
                secretKeyRef: {name: custom-db-ha-secrets, key: repmgr-password}
            - name: REPMGR_PRIMARY_HOST
              value: "postgres-ha-0.postgres-ha-headless.bookit.svc.cluster.local"
            - name: REPMGR_PARTNER_NODES
              value: "postgres-ha-0.postgres-ha-headless.bookit.svc.cluster.local,postgres-ha-1.postgres-ha-headless.bookit.svc.cluster.local,postgres-ha-2.postgres-ha-headless.bookit.svc.cluster.local"
            - name: REPMGR_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: REPMGR_NODE_NETWORK_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: data
              mountPath: /bitnami/postgresql
        # Metrics Exporter
        - name: metrics
          image: bitnami/postgres-exporter:latest
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef: {name: custom-db-ha-secrets, key: postgres-exporter-dsn}
          ports:
            - containerPort: 9187
              name: metrics
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-ha-headless
  namespace: bookit
spec:
  ports:
    - port: 5432
      name: tcp-postgresql
  clusterIP: None
  selector:
    app: postgres-ha
---
# Pgpool Proxy for Automatic Failover & Read Scaling
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgpool
  namespace: bookit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgpool
  template:
    metadata:
      labels:
        app: pgpool
    spec:
      containers:
        - name: pgpool
          image: bitnami/pgpool:latest
          env:
            - name: PGPOOL_BACKEND_NODES
              value: "0:postgres-ha-0.postgres-ha-headless.bookit.svc.cluster.local:5432,1:postgres-ha-1.postgres-ha-headless.bookit.svc.cluster.local:5432,2:postgres-ha-2.postgres-ha-headless.bookit.svc.cluster.local:5432"
            - name: PGPOOL_SR_CHECK_USER
              value: "postgres"
            - name: PGPOOL_SR_CHECK_PASSWORD
              valueFrom:
                secretKeyRef: {name: custom-db-ha-secrets, key: postgres-password}
            - name: PGPOOL_ENABLE_LOAD_BALANCING
              value: "yes"
            - name: PGPOOL_POSTGRES_USERNAME
              value: "postgres"
            - name: PGPOOL_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: custom-db-ha-secrets, key: postgres-password}
            - name: PGPOOL_ADMIN_USERNAME
              value: "admin"
            - name: PGPOOL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: custom-db-ha-secrets, key: pgpool-admin-password}
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-proxy
  namespace: bookit
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: pgpool
{{ end }}
