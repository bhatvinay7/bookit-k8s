{{- if .Values.postgres.useCloudProvider }}
{{- if and .Values.postgres.host (ne .Values.postgres.host "") }}
# ExternalName Service to route in-cluster traffic to the managed cloud Postgres.
# Set postgres.host in your values file to the actual DigitalOcean DB hostname.
apiVersion: v1
kind: Service
metadata:
  name: postgres-proxy
  namespace: bookit
spec:
  type: ExternalName
  externalName: {{ .Values.postgres.host }}
{{- end }}
{{- end }}
