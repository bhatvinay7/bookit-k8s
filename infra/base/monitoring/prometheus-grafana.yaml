apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 51.2.0
    helm:
      values: |
        alertmanager:
          config:
            global:
              resolve_timeout: 5m
              smtp_smarthost: 'smtp.gmail.com:587'
              smtp_from: 'alerts@bookit4u.shop'
              smtp_auth_username: 'tickethandle24@gmail.com'
              smtp_auth_password: 'SET_YOUR_GMAIL_APP_PASSWORD_HERE'
              smtp_require_tls: true
            route:
              group_by: ['namespace', 'alertname']
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              receiver: 'email-notifications'
              routes:
                - matchers:
                    - severity="critical"
                  receiver: 'email-notifications'
            receivers:
              - name: 'email-notifications'
                email_configs:
                  - to: 'tickethandle24@gmail.com'
                    send_resolved: true
        grafana:
          adminPassword: admin
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: "letsencrypt-prod"
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
            hosts:
              - grafana.bookit4u.shop
            tls:
              - secretName: grafana-bookit-shop-tls
                hosts:
                  - grafana.bookit4u.shop
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
          additionalDataSources:
            - name: Tempo
              type: tempo
              uid: tempo
              url: http://tempo.monitoring.svc.cluster.local:3200
              access: proxy
        additionalServiceMonitors:
          - name: otel-collector
            namespace: monitoring
            selector:
              matchLabels:
                app: otel-collector
            namespaceSelector:
              matchNames:
                - monitoring
            endpoints:
              - port: metrics
                path: /metrics
                interval: 15s
        prometheus:
          prometheusSpec:
            retention: 15d
            # DigitalOcean block storage StorageClass is required or PVCs stay Pending.
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: do-block-storage
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 10Gi
            serviceMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelector: {}
            serviceMonitorNamespaceSelector: {}
            podMonitorSelectorNilUsesHelmValues: false
            podMonitorSelector: {}
            podMonitorNamespaceSelector: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # Required for large CRDs that exceed annotation size limits
      - ReplaceResourceSyncOptions=true
