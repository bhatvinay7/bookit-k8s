apiVersion: v1
kind: ConfigMap
metadata:
  name: bookit-distributed-tracing-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  distributed-tracing.json: |-
    {
      "uid": "bookit-distributed-tracing",
      "title": "Bookit Distributed Tracing",
      "schemaVersion": 38,
      "version": 1,
      "tags": [
        "bookit",
        "opentelemetry"
      ],
      "timezone": "browser",
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "description": "Rates and latency from sampled server/consumer spans. Each service is separate; client/internal spans are excluded to avoid counting each request multiple times within a service. HTTP duration ends at response headers. Tempo stores individual traces; Loki stores logs.",
      "templating": {
        "list": [
          {
            "name": "service",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(bookit_traces_spanmetrics_calls_total,service_name)",
            "refresh": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Inbound requests / messages per second",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(service_name,span_name)(rate(bookit_traces_spanmetrics_calls_total{service_name=~\"$service\",span_kind=~\"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER\"}[5m]))",
              "legendFormat": "{{service_name}} \u2014 {{span_name}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Failed requests / messages per second",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 24,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(service_name,span_name)(rate(bookit_traces_spanmetrics_calls_total{service_name=~\"$service\",span_kind=~\"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER\",status_code=\"STATUS_CODE_ERROR\"}[5m]))",
              "legendFormat": "{{service_name}} \u2014 {{span_name}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Request / message processing latency",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 24,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5, sum by(le,service_name,span_name)(rate(bookit_traces_spanmetrics_duration_seconds_bucket{service_name=~\"$service\",span_kind=~\"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER\"}[5m])))",
              "legendFormat": "p50 {{service_name}} \u2014 {{span_name}}"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by(le,service_name,span_name)(rate(bookit_traces_spanmetrics_duration_seconds_bucket{service_name=~\"$service\",span_kind=~\"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER\"}[5m])))",
              "legendFormat": "p95 {{service_name}} \u2014 {{span_name}}"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by(le,service_name,span_name)(rate(bookit_traces_spanmetrics_duration_seconds_bucket{service_name=~\"$service\",span_kind=~\"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER\"}[5m])))",
              "legendFormat": "p99 {{service_name}} \u2014 {{span_name}}"
            }
          ]
        }
      ]
    }
