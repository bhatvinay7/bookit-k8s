apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: bookit
spec:
  schedule: "0 0 * * *" # Daily at midnight
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: pg-backup
            image: postgres:15-alpine
            command:
            - /bin/sh
            - -c
            - |
              TIMESTAMP=$(date +%Y%m%d%H%M%S)
              set -eu
              pg_dump "$DATABASE_URL" -F c -f "/backup/postgres-$TIMESTAMP.dump"
              touch /backup/.ready
            envFrom:
            - secretRef:
                name: backend-secrets
            volumeMounts:
            - name: backup
              mountPath: /backup
          - name: r2-upload
            image: rclone/rclone:1.68.2
            command: ["/bin/sh", "-ec"]
            args:
            - |
              attempts=0
              until [ -f /backup/.ready ]; do
                attempts=$((attempts + 1))
                [ "$attempts" -lt 300 ] || { echo "timed out waiting for PostgreSQL dump"; exit 1; }
                sleep 2
              done
              rclone copy /backup "r2:${CLOUDFLARE_R2_BUCKET}/${BOOKIT_ENVIRONMENT:-unknown}/${BOOKIT_REGION:-unknown}/postgres" \
                --exclude .ready --checksum
            envFrom:
            - configMapRef:
                name: bookit-config
            env:
            - name: CLOUDFLARE_R2_BUCKET
              valueFrom:
                secretKeyRef: {name: bookit-secrets, key: CLOUDFLARE_R2_BUCKET}
            - name: RCLONE_CONFIG_R2_TYPE
              value: s3
            - name: RCLONE_CONFIG_R2_PROVIDER
              value: Other
            - name: RCLONE_CONFIG_R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: bookit-secrets, key: CLOUDFLARE_R2_ACCESS_KEY_ID}
            - name: RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: bookit-secrets, key: CLOUDFLARE_R2_SECRET_ACCESS_KEY}
            - name: RCLONE_CONFIG_R2_ENDPOINT
              valueFrom:
                secretKeyRef: {name: bookit-secrets, key: CLOUDFLARE_R2_ENDPOINT}
            - name: RCLONE_CONFIG_R2_ACL
              value: private
            volumeMounts:
            - name: backup
              mountPath: /backup
          restartPolicy: OnFailure
          volumes:
          - name: backup
            emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongodb-backup
  namespace: bookit
spec:
  schedule: "30 0 * * *" # Daily at 00:30
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: mongo-backup
            image: mongo:6
            command:
            - /bin/sh
            - -c
            - |
              TIMESTAMP=$(date +%Y%m%d%H%M%S)
              set -eu
              mongodump --uri="$MONGODB_URL" --archive="/backup/mongodb-$TIMESTAMP.gz" --gzip
              touch /backup/.ready
            envFrom:
            - secretRef:
                name: backend-secrets
            volumeMounts:
            - name: backup
              mountPath: /backup
          - name: r2-upload
            image: rclone/rclone:1.68.2
            command: ["/bin/sh", "-ec"]
            args:
            - |
              attempts=0
              until [ -f /backup/.ready ]; do
                attempts=$((attempts + 1))
                [ "$attempts" -lt 300 ] || { echo "timed out waiting for MongoDB dump"; exit 1; }
                sleep 2
              done
              rclone copy /backup "r2:${CLOUDFLARE_R2_BUCKET}/${BOOKIT_ENVIRONMENT:-unknown}/${BOOKIT_REGION:-unknown}/mongodb" \
                --exclude .ready --checksum
            envFrom:
            - configMapRef:
                name: bookit-config
            env:
            - name: CLOUDFLARE_R2_BUCKET
              valueFrom:
                secretKeyRef: {name: bookit-secrets, key: CLOUDFLARE_R2_BUCKET}
            - name: RCLONE_CONFIG_R2_TYPE
              value: s3
            - name: RCLONE_CONFIG_R2_PROVIDER
              value: Other
            - name: RCLONE_CONFIG_R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: bookit-secrets, key: CLOUDFLARE_R2_ACCESS_KEY_ID}
            - name: RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: bookit-secrets, key: CLOUDFLARE_R2_SECRET_ACCESS_KEY}
            - name: RCLONE_CONFIG_R2_ENDPOINT
              valueFrom:
                secretKeyRef: {name: bookit-secrets, key: CLOUDFLARE_R2_ENDPOINT}
            - name: RCLONE_CONFIG_R2_ACL
              value: private
            volumeMounts:
            - name: backup
              mountPath: /backup
          restartPolicy: OnFailure
          volumes:
          - name: backup
            emptyDir: {}
