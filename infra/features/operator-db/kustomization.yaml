apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Optional in-cluster operator-managed data plane. Do not include this feature
# when DATABASE_URL, MONGODB_URL, and REDIS_URL point to managed cloud services.
# Install compatible CRDs/controllers and operator-specific Secrets first.
resources:
- https://download.elastic.co/downloads/eck/3.5.0/crds.yaml
- https://download.elastic.co/downloads/eck/3.5.0/operator.yaml
- multi-region/postgres-operator.yaml
- multi-region/mongodb-operator.yaml
- databases/redis-cluster.yaml
- databases/elasticsearch.yaml

labels:
- pairs:
    app.kubernetes.io/part-of: bookit-operator-db
  includeSelectors: false
