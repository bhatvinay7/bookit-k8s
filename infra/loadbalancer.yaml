apiVersion: v1
kind: Service
metadata:
  name: l4-loadbalancer
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
  selector:
    # Update this selector to match your target pods (e.g., ingress-nginx)
    app.kubernetes.io/name: ingress-nginx
