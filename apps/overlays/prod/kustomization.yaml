apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

namespace: bookit

configMapGenerator:
- name: bookit-config
  behavior: merge
  literals:
  - NODE_ENV=production
  - BOOKIT_ENVIRONMENT=prod

labels:
- pairs:
    app.kubernetes.io/part-of: bookit
    bookit.io/environment: prod
  includeSelectors: false
