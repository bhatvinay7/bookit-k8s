apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-trigger-auth
  namespace: bookit
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretTargetRef:
  - parameter: ca
    # Trust the CA that signed the certificate RabbitMQ is serving now. This
    # stays correct while cert-manager rotates server and client certificates.
    name: rabbitmq-server-tls
    key: ca.crt
  - parameter: cert
    name: rabbitmq-client-tls
    key: tls.crt
  - parameter: key
    name: rabbitmq-client-tls
    key: tls.key
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: lock-server-rabbitmq
  namespace: bookit
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  scaleTargetRef:
    name: lock-server
  pollingInterval: 10
  cooldownPeriod: 180
  minReplicaCount: 1
  maxReplicaCount: 2
  fallback:
    failureThreshold: 3
    replicas: 1
  triggers:
  - type: rabbitmq
    metadata:
      host: amqps://rabbitmq.bookit.svc.cluster.local:5671/%2f
      tls: enable
      protocol: amqp
      queueName: locking_queue
      mode: QueueLength
      value: "20"
      activationValue: "1"
    authenticationRef:
      name: rabbitmq-trigger-auth
---
