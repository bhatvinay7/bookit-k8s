apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: lock-server-rabbitmq
  namespace: bookit
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  scaleTargetRef:
    name: lock-server
  pollingInterval: 10
  cooldownPeriod: 180
  minReplicaCount: 1
  maxReplicaCount: 2
  fallback:
    failureThreshold: 3
    replicas: 1
  triggers:
  - type: rabbitmq
    metadata:
      hostFromEnv: RABBITMQ_URL
      protocol: amqp
      queueName: locking_queue
      mode: QueueLength
      value: "20"
      activationValue: "1"
---
