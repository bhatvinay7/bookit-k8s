apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

namespace: bookit

configMapGenerator:
- behavior: merge
  literals:
  - NODE_ENV=development
  - CORS_ALLOWED_ORIGINS=http://localhost:3000,https://dev.bookit4u.shop,https://api.dev.bookit4u.shop,https://ws.dev.bookit4u.shop
  name: bookit-config

labels:
- pairs:
    app.kubernetes.io/part-of: bookit
    bookit.io/environment: dev



# Test-server resource profile. This patch applies uniformly to every Bookit
# Deployment in the development overlay; production retains the base sizing.

# A test cluster may burst to two pods per workload without allowing a noisy
# service to consume the complete node.
patches:
- patch: |-
    $patch: delete
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      name: unused
  target:
    kind: HorizontalPodAutoscaler
- patch: |-
    - op: replace
      path: /spec/tls/0/hosts/0
      value: api.dev.bookit4u.shop
    - op: replace
      path: /spec/tls/0/hosts/1
      value: ws.dev.bookit4u.shop
    - op: replace
      path: /spec/tls/0/hosts/2
      value: dev.bookit4u.shop
    - op: replace
      path: /spec/rules/0/host
      value: api.dev.bookit4u.shop
    - op: replace
      path: /spec/rules/1/host
      value: ws.dev.bookit4u.shop
    - op: replace
      path: /spec/rules/2/host
      value: dev.bookit4u.shop
    - op: remove
      path: /spec/rules/3
    - op: remove
      path: /spec/tls/0/hosts/3
    - op: replace
      path: /spec/tls/0/secretName
      value: dev-bookit-shop-tls
  target:
    kind: Ingress
    name: bookit-ingress
- patch: |-
    - op: replace
      path: /spec/tls/0/hosts/0
      value: grpc.dev.bookit4u.shop
    - op: replace
      path: /spec/rules/0/host
      value: grpc.dev.bookit4u.shop
    - op: replace
      path: /spec/tls/0/secretName
      value: grpc-dev-bookit-shop-tls
  target:
    kind: Ingress
    name: bookit-grpc-ingress
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
    - op: replace
      path: /spec/template/spec/containers/0/resources
      value:
        requests:
          cpu: 50m
          memory: 48Mi
          ephemeral-storage: 64Mi
        limits:
          cpu: 500m
          memory: 128Mi
          ephemeral-storage: 512Mi
  target:
    kind: Deployment
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources
      value:
        requests:
          cpu: 100m
          memory: 128Mi
          ephemeral-storage: 64Mi
        limits:
          cpu: 1000m
          memory: 256Mi
          ephemeral-storage: 512Mi
  target:
    kind: Deployment
    name: gateway-keeper
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources
      value:
        requests:
          cpu: 100m
          memory: 256Mi
          ephemeral-storage: 64Mi
        limits:
          cpu: 1000m
          memory: 512Mi
          ephemeral-storage: 512Mi
  target:
    kind: Deployment
    name: web
images:
- name: bookit-cdc-worker
  newName: ghcr.io/bhatvinay7/bookit-cdc-worker
  newTag: commit-dc2c184
- name: bookit-gateway-keeper
  newName: ghcr.io/bhatvinay7/bookit-gateway-keeper
  newTag: commit-feacf3a
- name: bookit-http-server
  newName: ghcr.io/bhatvinay7/bookit-http-server
  newTag: commit-eb4c268
- name: bookit-lock-server
  newName: ghcr.io/bhatvinay7/bookit-lock-server
  newTag: commit-feacf3a
- name: bookit-notification-worker
  newName: ghcr.io/bhatvinay7/bookit-notification-worker
  newTag: commit-151ca30
- name: bookit-outbox-server
  newName: ghcr.io/bhatvinay7/bookit-outbox-server
  newTag: commit-b6acd5b
- name: bookit-payment-processor
  newName: ghcr.io/bhatvinay7/bookit-payment-processor
  newTag: commit-dc2c184
- name: bookit-search-server
  newName: ghcr.io/bhatvinay7/bookit-search-server
  newTag: commit-dc2c184
- name: bookit-web
  newName: ghcr.io/bhatvinay7/bookit-web
  newTag: commit-f2dafcd
- name: bookit-ws-server
  newName: ghcr.io/bhatvinay7/bookit-ws-server
  newTag: commit-feacf3a
