apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

namespace: bookit

configMapGenerator:
- name: bookit-config
  behavior: merge
  literals:
  - NODE_ENV=development
  - BOOKIT_ENVIRONMENT=dev

labels:
- pairs:
    app.kubernetes.io/part-of: bookit
    bookit.io/environment: dev
  includeSelectors: false

patches:
- target:
    kind: Ingress
    name: bookit-ingress
  patch: |-
    - op: replace
      path: /spec/tls/0/hosts/0
      value: api.dev.boookit.shop
    - op: replace
      path: /spec/tls/0/hosts/1
      value: ws.dev.boookit.shop
    - op: replace
      path: /spec/tls/0/hosts/2
      value: dev.boookit.shop
    - op: replace
      path: /spec/rules/0/host
      value: api.dev.boookit.shop
    - op: replace
      path: /spec/rules/1/host
      value: ws.dev.boookit.shop
    - op: replace
      path: /spec/rules/2/host
      value: dev.boookit.shop
    - op: remove
      path: /spec/rules/3
    - op: remove
      path: /spec/tls/0/hosts/3
    - op: replace
      path: /spec/tls/0/secretName
      value: dev-boookit-shop-tls

- target:
    kind: Ingress
    name: bookit-grpc-ingress
  patch: |-
    - op: replace
      path: /spec/tls/0/hosts/0
      value: grpc.dev.boookit.shop
    - op: replace
      path: /spec/rules/0/host
      value: grpc.dev.boookit.shop
    - op: replace
      path: /spec/tls/0/secretName
      value: grpc-dev-boookit-shop-tls

# Test-server resource profile. This patch applies uniformly to every Bookit
# Deployment in the development overlay; production retains the base sizing.
- target:
    kind: Deployment
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
    - op: replace
      path: /spec/template/spec/containers/0/resources
      value:
        requests:
          cpu: 50m
          memory: 128Mi
          ephemeral-storage: 128Mi
        limits:
          cpu: 250m
          memory: 384Mi
          ephemeral-storage: 1Gi

# A test cluster may burst to two pods per workload without allowing a noisy
# service to consume the complete node.
- target:
    kind: HorizontalPodAutoscaler
  patch: |-
    - op: replace
      path: /spec/minReplicas
      value: 1
    - op: replace
      path: /spec/maxReplicas
      value: 2
