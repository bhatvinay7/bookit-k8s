apiVersion: v1
data:
  GRPC_PORT: '50051'
  HTTP_PORT: '8082'
  # PostgreSQL checkout fails before the gateway's upstream timeout, avoiding
  # a slow database request being counted as an HTTP-server outage.
  DB_CONNECTION_TIMEOUT_SECS: '10'
  HTTP_SERVER_TIMEOUT_SECS: '20'
  LOG_LEVEL: info
  METRICS_PORT: '9100'
  NODE_ENV: production
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.monitoring.svc.cluster.local:4317
  PAYMENT_MESSAGE_TTL_MS: '300000'
  SEARCH_GRPC_PORT: '50051'
  SEARCH_HTTP_PORT: '8084'
  WS_PORT: '8081'
  HTTP_SERVER_URL: 'http://http-server:8082'
  SEARCH_SERVER_GRPC_URL: 'http://search-server:50051'
kind: ConfigMap
metadata:
  labels:
    app: chess
  name: bookit-config
