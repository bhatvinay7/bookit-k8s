apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bookit-alerts
  namespace: bookit
  labels:
    release: kube-prometheus-stack
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "5"
spec:
  groups:
    - name: bookit.rules
      rules:
        # RED Method Alerts (Application level)
        - alert: HighErrorRate
          expr: sum by (service_name) (rate(bookit_traces_spanmetrics_calls_total{span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER",status_code="STATUS_CODE_ERROR"}[5m])) / sum by (service_name) (rate(bookit_traces_spanmetrics_calls_total{span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[5m])) > 0.05
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: High error rate on {{ $labels.service_name }}
            description: "{{ $labels.service_name }} has an error rate above 5% over the last 5 minutes."

        - alert: HighLatency
          expr: histogram_quantile(0.95, sum by (le, service_name) (rate(bookit_traces_spanmetrics_duration_seconds_bucket{span_kind=~"SPAN_KIND_SERVER|SPAN_KIND_CONSUMER"}[5m]))) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: High latency on {{ $labels.service_name }}
            description: "95th percentile latency on {{ $labels.service_name }} is over 2 seconds for 5 minutes."

        # USE Method Alerts (Infrastructure level)
        - alert: PodCrashLoopBackOff
          expr: rate(kube_pod_container_status_restarts_total{namespace="bookit"}[5m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Pod crashlooping in {{ $labels.namespace }}
            description: "Pod {{ $labels.pod }} is crashlooping."

        - alert: HighMemoryUsage
          expr: sum(container_memory_usage_bytes{namespace="bookit", container!=""}) by (pod) / sum(kube_pod_container_resource_limits{resource="memory", namespace="bookit"}) by (pod) > 0.90
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: High Memory Usage on {{ $labels.pod }}
            description: "Pod {{ $labels.pod }} is using over 90% of its memory limit."
