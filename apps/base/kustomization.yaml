apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- rbac.yaml
- cert-manager-issuer.yaml
- configmap.yaml
- http-server.yaml
- ws-server.yaml
- gateway-keeper.yaml
- lock-server.yaml
- notification-worker.yaml
- payment-processor.yaml
- search-server.yaml
- web.yaml
- ingress.yaml
- grpc-ingress.yaml

patches:
- target:
    kind: Deployment
    name: (gateway-keeper|http-server|lock-server|notification-worker|payment-processor)
  patch: |-
    - op: add
      path: /spec/template/spec/initContainers
      value:
      - name: rabbitmq-client-identity
        image: bitnamilegacy/rabbitmq:4.1.3-debian-12-r1
        command:
        - /bin/bash
        - -ec
        - >-
          openssl pkcs12 -export
          -in /rabbitmq-pem/tls.crt
          -inkey /rabbitmq-pem/tls.key
          -certfile /rabbitmq-pem/ca.crt
          -out /rabbitmq-identity/client.p12
          -passout pass:
        volumeMounts:
        - name: rabbitmq-client-pem
          mountPath: /rabbitmq-pem
          readOnly: true
        - name: rabbitmq-client-identity
          mountPath: /rabbitmq-identity
    - op: add
      path: /spec/template/spec/volumes
      value:
      - name: rabbitmq-client-pem
        secret:
          secretName: rabbitmq-client-tls
      - name: rabbitmq-client-identity
        emptyDir:
          medium: Memory
    - op: add
      path: /spec/template/spec/containers/0/volumeMounts
      value:
      - name: rabbitmq-client-pem
        mountPath: /rabbitmq-pem
        readOnly: true
      - name: rabbitmq-client-identity
        mountPath: /rabbitmq-identity
        readOnly: true
- target:
    kind: Deployment
    name: (http-server|notification-worker|payment-processor)
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env
      value:
      - name: RABBITMQ_URL
        value: amqps://rabbitmq-proxy.bookit.svc.cluster.local:5671/%2f?auth_mechanism=external
      - name: RABBITMQ_TLS_CA_PATH
        value: /rabbitmq-pem/ca.crt
      - name: RABBITMQ_TLS_IDENTITY_PATH
        value: /rabbitmq-identity/client.p12
- target:
    kind: Deployment
    name: (gateway-keeper|lock-server)
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: RABBITMQ_URL
        value: amqps://rabbitmq-proxy.bookit.svc.cluster.local:5671/%2f?auth_mechanism=external
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: RABBITMQ_TLS_CA_PATH
        value: /rabbitmq-pem/ca.crt
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: RABBITMQ_TLS_IDENTITY_PATH
        value: /rabbitmq-identity/client.p12
