apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: delivery-allow-egress
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - notification-worker
      - http-server
  policyTypes:
  - Egress
  # Allow all outbound destinations, protocols and ports, including DNS,
  # SMTP, R2 HTTPS and internal database/broker/service connections.
  egress:
  - {}
