apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: notification-worker
  name: notification-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-worker
  template:
    metadata:
      labels:
        app: notification-worker
    spec:
      containers:
        - envFrom:
            - secretRef:
                name: backend-secrets
            - secretRef:
                name: bookit-secrets
            - configMapRef:
                name: bookit-config
          # Explicit references prevent legacy bookit-secrets from overriding delivery settings.
          env:
            - name: OTEL_SERVICE_NAME
              value: bookit-notification-worker
            - name: K8S_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=$(K8S_NAMESPACE),k8s.pod.name=$(POD_NAME)
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SMTP_HOST
            # Require STARTTLS on the outbound SMTP connection.
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_SECURE
              value: "false"
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SMTP_PASS
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SMTP_FROM
            - name: GMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: GMAIL_USER
            - name: GMAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: GMAIL_APP_PASSWORD
          image: bookit-notification-worker:latest
          name: notification-worker
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
      imagePullSecrets:
        - name: ghcr-secret
      serviceAccountName: bookit-app
