apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app: bookit
  name: bookit-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app: bookit
  name: bookit-secrets-reader
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
      - configmaps
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app: bookit
  name: bookit-secrets-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bookit-secrets-reader
subjects:
  - kind: ServiceAccount
    name: bookit-app
