apiVersion: v1
kind: ServiceAccount
metadata:
  name: bookit-app
  labels:
    app: bookit

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bookit-secrets-reader
  labels:
    app: chess
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bookit-secrets-reader-binding
  labels:
    app: chess
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bookit-secrets-reader
subjects:
  - kind: ServiceAccount
    name: bookit-app
