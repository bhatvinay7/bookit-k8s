apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: search-server
  name: search-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-server
  template:
    metadata:
      labels:
        app: search-server
    spec:
      containers:
      - envFrom:
        - secretRef:
            name: backend-secrets
        - configMapRef:
            name: bookit-config
        image: bookit-search-server:latest
        name: search-server
        ports:
        - containerPort: 8084
          name: http
        - containerPort: 50051
          name: grpc
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
      imagePullSecrets:
      - name: ghcr-secret
      serviceAccountName: bookit-app
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: search-server
  name: search-server
spec:
  ports:
  - name: http
    port: 8084
    targetPort: 8084
  - name: grpc
    port: 50051
    targetPort: 50051
  selector:
    app: search-server
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: search-server-hpa
spec:
  maxReplicas: 5
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 75
        type: Utilization
    type: Resource
  minReplicas: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: search-server
