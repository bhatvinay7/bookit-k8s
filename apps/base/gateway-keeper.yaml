apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gateway-keeper
  name: gateway-keeper
  namespace: bookit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway-keeper
  template:
    metadata:
      labels:
        app: gateway-keeper
    spec:
      containers:
      - env:
        - name: GATEWAY_KEEPER_ADDR
          value: 0.0.0.0:8080
        - name: GATEWAY_KEEPER_GRPC_ADDR
          value: '[::]:50052'
        envFrom:
        - secretRef:
            name: backend-secrets
        - configMapRef:
            name: bookit-config
        image: bookit-gateway-keeper:latest
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        name: gateway-keeper
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 50052
          name: grpc
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
      imagePullSecrets:
      - name: ghcr-secret
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: gateway-keeper
  name: gateway-keeper
  namespace: bookit
spec:
  clusterIP: None
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: grpc
    port: 50052
    targetPort: 50052
  selector:
    app: gateway-keeper
  type: ClusterIP
