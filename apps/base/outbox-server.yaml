apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: '1'
  labels:
    app: outbox-server
  name: outbox-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: outbox-server
  template:
    metadata:
      labels:
        app: outbox-server
    spec:
      containers:
      - env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: DATABASE_URL
              name: backend-secrets
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              key: RABBITMQ_URL
              name: backend-secrets
        envFrom:
        - configMapRef:
            name: bookit-config
        image: bookit-outbox-server:latest
        name: outbox-server
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
      imagePullSecrets:
      - name: ghcr-secret
      initContainers:
      - args:
        - --migrate-only
        command:
        - outbox-server
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: DATABASE_URL
              name: backend-secrets
        image: bookit-outbox-server:latest
        name: migrate-payment-outbox
      serviceAccountName: bookit-app
