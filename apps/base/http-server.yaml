apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
  labels:
    app: http-server
  name: http-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http-server
  template:
    metadata:
      labels:
        app: http-server
    spec:
      containers:
      - envFrom:
        - secretRef:
            name: backend-secrets
        - secretRef:
            name: frontend-secrets
        - secretRef:
            name: bookit-secrets
        - configMapRef:
            name: bookit-config
        image: bookit-http-server:latest
        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 15
          periodSeconds: 20
        name: http-server
        ports:
        - containerPort: 8082
          name: http
        readinessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
      imagePullSecrets:
      - name: ghcr-secret
      serviceAccountName: bookit-app
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: http-server
  name: http-server
spec:
  ports:
  - name: http
    port: 8082
    targetPort: 8082
  selector:
    app: http-server
  type: ClusterIP
