apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-keeper
  namespace: bookit
  labels:
    app: gateway-keeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-keeper
  template:
    metadata:
      labels:
        app: gateway-keeper
    spec:
      containers:
        - name: gateway-keeper
          image: ghcr.io/bhatvinay7/bookit-gateway-keeper:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 50052
              name: grpc
          envFrom:
            - secretRef:
                name: backend-secrets
            - configMapRef:
                name: bookit-config
          env:
            - name: GATEWAY_KEEPER_ADDR
              value: "0.0.0.0:8080"
            - name: GATEWAY_KEEPER_GRPC_ADDR
              value: "[::]:50052"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-keeper
  namespace: bookit
spec:
  type: ClusterIP
  selector:
    app: gateway-keeper
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 50052
      targetPort: 50052
