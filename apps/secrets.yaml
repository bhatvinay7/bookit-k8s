apiVersion: v1
kind: Secret
metadata:
  name: bookit-secrets
  labels:
    app: bookit
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/compare-options: IgnoreExtraneous
type: Opaque
stringData:
  # Connection URLs (injected via GitHub Secrets in CI/CD)
  DATABASE_URL: "${{ secrets.DATABASE_URL }}"
  REPLICATION_URL: "${{ secrets.REPLICATION_URL }}"
  MONGO_DB_URL: "${{ secrets.MONGO_DB_URL }}"
  REDIS_URL: "${{ secrets.REDIS_URL }}"
  RABBITMQ_URL: "${{ secrets.RABBITMQ_URL }}"
  GRPC_SERVER_URL: "${{ secrets.GRPC_SERVER_URL }}"
  
  # CDC / Logical Replication
  SLOT_NAME: "${{ secrets.SLOT_NAME }}"
  PUBLICATION: "${{ secrets.PUBLICATION }}"

  # Encryption & Security Keys
  INVITATION_ENCRYPTION_KEY: "${{ secrets.INVITATION_ENCRYPTION_KEY }}"
  
  # Email Configuration
  SMTP_HOST: "${{ secrets.SMTP_HOST }}"
  SMTP_PORT: "${{ secrets.SMTP_PORT }}"
  SMTP_SECURE: "${{ secrets.SMTP_SECURE }}"
  SMTP_USER: "${{ secrets.SMTP_USER }}"
  SMTP_PASS: "${{ secrets.SMTP_PASS }}"
  SMTP_FROM: "${{ secrets.SMTP_FROM }}"

  # Media Upload (Cloudinary)
  CLOUDINARY_CLOUD_NAME: "${{ secrets.CLOUDINARY_CLOUD_NAME }}"
  CLOUDINARY_API_KEY: "${{ secrets.CLOUDINARY_API_KEY }}"
  CLOUDINARY_API_SECRET: "${{ secrets.CLOUDINARY_API_SECRET }}"

  # Cloudflare R2 Object Storage
  CLOUDFLARE_R2_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}"
  CLOUDFLARE_R2_ACCESS_KEY_ID: "${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}"
  CLOUDFLARE_R2_SECRET_ACCESS_KEY: "${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}"
  CLOUDFLARE_R2_BUCKET: "${{ secrets.CLOUDFLARE_R2_BUCKET }}"
  CLOUDFLARE_R2_PUBLIC_URL: "${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}"

  # Google OAuth Configuration
  GOOGLE_CLIENT_ID: "${{ secrets.GOOGLE_CLIENT_ID }}"
  GOOGLE_CLIENT_SECRET: "${{ secrets.GOOGLE_CLIENT_SECRET }}"
  NEXT_PUBLIC_GOOGLE_CLIENT_ID: "${{ secrets.GOOGLE_CLIENT_ID }}"
