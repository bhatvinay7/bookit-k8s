apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chess-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/bhatvinay75/chess-k8s.git
    targetRevision: HEAD
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: chess-secrets
      jsonPointers:
        - /data
        - /stringData
    - group: ""
      kind: Secret
      name: frontend-secrets
      jsonPointers:
        - /data
        - /stringData
    - group: ""
      kind: Secret
      name: backend-secrets
      jsonPointers:
        - /data
        - /stringData
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
