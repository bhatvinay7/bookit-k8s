apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bookit-prod
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: prod-cluster-us-east
            url: https://kubernetes.default.svc
            appsPath: apps/regions/prod/us-east
  template:
    metadata:
      name: "{{cluster}}-prod-apps"
      annotations:
        argocd.argoproj.io/sync-wave: "10"
    spec:
      project: default
      source:
        repoURL: https://github.com/bhatvinay7/bookit-k8s.git
        targetRevision: main
        path: "{{appsPath}}"
      destination:
        server: "{{url}}"
        namespace: bookit
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bookit-infra-prod
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: prod-cluster-us-east
            url: https://kubernetes.default.svc
  template:
    metadata:
      name: "{{cluster}}-prod-infra"
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: default
      source:
        repoURL: https://github.com/bhatvinay7/bookit-k8s.git
        targetRevision: main
        path: infra/overlays/prod
      destination:
        server: "{{url}}"
        namespace: bookit
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
