name: Validate GitOps Manifests

on:
  pull_request:
    branches: [deployment1, main] # dev commented out / replaced
  push:
    # branches: [dev]
    branches: [deployment1]

concurrency:
  group: validate-gitops-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Render dev and production overlays
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install PyYAML==6.0.3
      - name: Validate monitoring, namespaces and images
        run: |
          python3 scripts/validate-monitoring.py
          python3 scripts/test-bootstrap-monitoring.py

      - name: Render all Kustomize targets
        run: |
          targets=(
            apps/regions/dev/us-east
            apps/regions/prod/us-east
            infra/overlays/dev
            infra/overlays/prod
            infra/features/operator-db
          )
          for target in "${targets[@]}"; do
            echo "Rendering $target"
            kubectl kustomize "$target" >/dev/null
          done

      - name: Validate outbox deployment contract
        run: |
          for target in apps/regions/dev/us-east apps/regions/prod/us-east; do
            rendered=$(mktemp)
            kubectl kustomize "$target" > "$rendered"
            grep -q 'name: outbox-server' "$rendered"
            grep -q 'name: migrate-payment-outbox' "$rendered"
            grep -q 'name: DATABASE_URL' "$rendered"
            grep -q 'name: RABBITMQ_URL' "$rendered"
            grep -q 'PAYMENT_MESSAGE_TTL_MS:' "$rendered"
            rm "$rendered"
          done

      - name: Reject plaintext secret manifests
        run: |
          if git grep -n -E '^kind: Secret$|^stringData:' -- '*.yaml' '*.yml'; then
            echo "Plain Kubernetes Secret manifests are forbidden. Commit SealedSecret ciphertext only."
            exit 1
          fi
