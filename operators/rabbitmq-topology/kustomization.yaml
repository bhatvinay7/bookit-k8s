apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/rabbitmq/messaging-topology-operator/config/default?ref=v1.20.2
  - rabbitmq-pki.yaml

images:
  - name: rabbitmqoperator/messaging-topology-operator
    newName: ghcr.io/rabbitmq/messaging-topology-operator
    newTag: 1.20.2

patches:
  # The Cluster Operator application owns this shared namespace.
  - target:
      version: v1
      kind: Namespace
      name: rabbitmq-system
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: rabbitmq-system
  - path: topology-operator-ca-patch.yaml
