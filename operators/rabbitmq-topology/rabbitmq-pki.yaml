apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: rabbitmq-selfsigned
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rabbitmq-ca
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  isCA: true
  commonName: Bookit RabbitMQ CA
  secretName: rabbitmq-ca
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: rabbitmq-selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: rabbitmq-ca
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  ca:
    # ClusterIssuer CA Secrets live in cert-manager's cluster-resource namespace.
    secretName: rabbitmq-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rabbitmq-topology-ca
  namespace: rabbitmq-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: rabbitmq-topology-ca
  commonName: rabbitmq-topology-operator
  duration: 2160h
  renewBefore: 360h
  usages:
    - client auth
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: rabbitmq-ca
    kind: ClusterIssuer
